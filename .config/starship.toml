# ~/.config/starship.toml

add_newline = false

format = """
$username$hostname $directory $git_branch$git_status $character
"""

[username]
show_always = true
style_user = "bold yellow"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold green"
format = "[@$hostname]($style)"

[directory]
style = "bold blue"

[git_branch]
symbol = " "
style = "purple"

[git_status]
style = "red"

[character]
success_symbol = "[➜](#81A1C1)"
error_symbol = "[➜](red)"

